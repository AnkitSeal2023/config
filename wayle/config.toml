[general]
font-sans = "JetBrains Mono Nerd Font"

[bar]
scale = 0.699999988079071
background-opacity = 100
location = "bottom"
inset-ends = 0.4
padding = 0.4000000059604645
padding-ends = 0.4000000059604645
module-gap = 0.4000000059604645
inset-edge = 0.4
bg = "bg-base"
border-width = 0
rounding = "lg"
button-variant = "icon-square"
button-icon-position = "end"
button-bg-opacity = 100
button-icon-size = 0.949999988079071
button-label-size = 1.2000000476837158
button-label-weight = "bold"
button-rounding = "lg"
button-group-background = "bg-surface"
button-group-opacity = 100

[[bar.layout]]
monitor = "*"
show = true
left = [
  "hyprland-workspaces",
  "media",
  "cava",
]
center = [
  "clock",
  "idle-inhibit",
  "notifications",
]
right = [
  "netstat",
  "cpu",
  "ram",
  "custom-brightness",
  {
    name = "audio",
    modules = [
      "volume",
      "microphone",
    ]
  },
  "network",
  "bluetooth",
  "systray",
  "dashboard",
]

[styling]
scale = 1.0
matugen-scheme = "content"

[styling.palette]
bg = "#0d0c0c"
surface = "#181616"
elevated = "#282727"
fg = "#c5c9c5"
fg-muted = "#a6a69c"
primary = "#8992a7"
red = "#c4746e"
yellow = "#c4b28a"
green = "#87a987"
blue = "#8ba4b0"

[modules.bluetooth]
border-color = "green"
icon-color = "bg-elevated"
icon-bg-color = "green"
label-color = "fg-default"
button-bg-color = "bg-surface"

[modules.cava]
bars = 40
color = "#deddda"
button-bg-color = "bg-surface"
bar-width = 2
border-color = "green"

[modules.clock]
format = "%d/%m/%y — %H:%M:%S"
border-color = "yellow"
icon-color = "accent"
icon-show = false
label-color = "fg-default"
button-bg-color = "bg-surface"

[modules.cpu]
border-color = "fg-muted"
icon-color = "bg-elevated"
icon-bg-color = "green"
label-color = "fg-default"
button-bg-color = "bg-surface"

[modules.dashboard]
icon-color = "fg-default"
icon-bg-color = "bg-elevated"
right-click = "exec kitty"

[modules.hyprland-workspaces]
min-workspace-count = 0
show-special = false
divider = "|"
app-icons-show = true
workspace-padding = 0.5
label-size = 0.8999999761581421
occupied-color = "fg-default"
container-bg-color = "bg-surface"
border-color = "green"

[modules.idle-inhibit]
border-color = "yellow"
label-show = false
icon-color = "fg-default"
icon-bg-color = "bg-surface"
button-bg-color = "bg-surface"

[modules.media]
left-click = "exec playerctl play-pause"
format = "{{status_icon}} {{ title }} - {{ artist }}"
spinning-disc-icon = "si-spotify-symbolic"
icon-show = true
icon-type = "spinning-disc"
icon-name = "si-spotify-symbolic"
middle-click = "dropdown:media"
border-color = "green"
icon-color = "green"
icon-bg-color = "transparent"
label-color = "fg-default"
button-bg-color = "bg-surface"

[modules.media.player-icons]

[modules.microphone]
icon-color = "bg-elevated"
icon-bg-color = "green"
label-color = "fg-default"
button-bg-color = "transparent"
scroll-up = "wayle audio input-volume +5"
scroll-down = "wayle audio input-volume -5"
left-click = "wayle audio input-mute"
middle-click = "dropdown:audio"

[modules.network]
border-color = "fg-default"
icon-color = "bg-elevated"
icon-bg-color = "green"
label-color = "fg-default"
button-bg-color = "bg-surface"

[modules.netstat]
label-color = "fg-default"
format = " {{ down_auto }}   {{ up_auto }}"
left-click = "dropdown:netstat"
icon-show = false
button-bg-color = "bg-surface"

[modules.notifications]
label-show = false
border-color = "yellow"
icon-color = "fg-default"
icon-bg-color = "transparent"
label-color = "fg-default"
button-bg-color = "bg-surface"
popup-close-behavior = "remove"
popup-urgency-bar = "none"

[modules.ram]
icon-color = "bg-elevated"
label-color = "fg-default"
button-bg-color = "bg-surface"
right-click = "dropdown:system-info"

[[modules.custom]]
id = "brightness"
label-show = false
icon-color = "bg-surface"
icon-bg-color = "green"
label-color = "fg-default"
button-bg-color = "bg-surface"
icon-name = "ld-sun-symbolic"
left-click = "dropdown:brightness"
right-click = "dropdown:contrast"

[modules.separator]
color = "fg-default"

[modules.systray]
icon-scale = 1.100000023841858
border-color = "yellow"
button-bg-color = "bg-surface"

[modules.volume]
icon-color = "bg-elevated"
scroll-up = "wayle audio output-volume +5"
scroll-down = "wayle audio output-volume -5"
left-click = "wayle audio output-mute"
middle-click = "dropdown:audio"
icon-bg-color = "green"
label-color = "fg-default"
button-bg-color = "transparent"

[modules.weather]
location = "Kolkata"

# Demo: user-defined dropdown panels (opened via `dropdown:<id>` click actions).
[[modules.dropdowns]]
id = "system-info"
title = "System"
width = 320
interval-ms = 5000
close-on-click = false
command = '''
kernel=$(uname -r)
up=$(uptime -p | sed 's/^up //')
mem=$(free -m | awk 'NR==2 {printf "%s / %s MiB", $3, $2}')
disk=$(df -h / | awk 'NR==2 {print $3 " / " $2}')
jq -cn --arg k "$kernel" --arg u "$up" --arg m "$mem" --arg d "$disk" \
  '{items: ["Kernel:  \($k)", "Uptime:  \($u)", "Memory:  \($m)", "Disk:    \($d)"]}'
'''

[[modules.dropdowns]]
id = "brightness"
icon = "ld-sun-symbolic"
title = "Brightness"
width = 320
interval-ms = 5000
close-on-click = false

[[modules.dropdowns.items]]
label = "20%"
icon = "ld-moon-symbolic"
command = "ddcutil --bus 5 setvcp 10 20"

[[modules.dropdowns.items]]
label = "40%"
icon = "ld-sun-moon-symbolic"
command = "ddcutil --bus 5 setvcp 10 40"

[[modules.dropdowns.items]]
label = "60%"
icon = "ld-sun-dim-symbolic"
command = "ddcutil --bus 5 setvcp 10 60"

[[modules.dropdowns.items]]
label = "80%"
icon = "ld-sun-medium-symbolic"
command = "ddcutil --bus 5 setvcp 10 80"

[[modules.dropdowns.items]]
label = "100%"
icon = "ld-sun-symbolic"
command = "ddcutil --bus 5 setvcp 10 100"

[[modules.dropdowns]]
id = "contrast"
icon = "ld-sun-symbolic"
title = "Contrast"
width = 320
interval-ms = 5000
close-on-click = false

[[modules.dropdowns.items]]
label = "20%"
icon = "ld-moon-symbolic"
command = "ddcutil --bus 5 setvcp 12 20"

[[modules.dropdowns.items]]
label = "40%"
icon = "ld-sun-moon-symbolic"
command = "ddcutil --bus 5 setvcp 12 40"

[[modules.dropdowns.items]]
label = "60%"
icon = "ld-sun-dim-symbolic"
command = "ddcutil --bus 5 setvcp 12 60"

[[modules.dropdowns.items]]
label = "80%"
icon = "ld-sun-medium-symbolic"
command = "ddcutil --bus 5 setvcp 12 80"

[[modules.dropdowns.items]]
label = "100%"
icon = "ld-sun-symbolic"
command = "ddcutil --bus 5 setvcp 12 100"

[wallpaper]
engine-enabled = false
